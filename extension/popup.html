<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Chrome Unbot</title>
    <style>
      body { font-family: sans-serif; padding: 10px; }
      button { padding: 8px 12px; }
      pre { white-space: pre-wrap; font-size: 12px; margin-top: 10px; }
    </style>
  </head>
  <body>
  <h2 style="margin:0 0 10px 0;">Chrome Unbot</h2>

  <div id="scoreBox" style="
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 10px;
  ">—</div>

  <div id="riskBar" style="
    height: 10px;
    background: linear-gradient(to right, #4caf50, #ffeb3b, #f44336);
    border-radius: 5px;
    margin-bottom: 15px;
  "></div>

  <h4>Reasons</h4>
  <ul id="reasons" style="padding-left: 20px; font-size: 13px;"></ul>

  <h4>Fixes</h4>
  <ul id="fixes" style="padding-left: 20px; font-size: 13px;"></ul>

  <div id="meta" style="margin-top: 15px; font-size: 11px; opacity: 0.7;"></div>

  <button id="scan" style="
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    font-size: 14px;
  ">Collect fingerprint</button>

  <script src="popup.js"></script>
</body>

</html>
